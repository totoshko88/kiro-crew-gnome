name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UUID: kiro-crew@totoshko88.github.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GJS
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-dev

      - name: Run pure-logic test suite
        run: make test-logic

      - name: Validate extension structure
        run: |
          # Required files live in the nested extension subdir.
          for file in extension.js metadata.json; do
            if [ ! -f "$UUID/$file" ]; then
              echo "Missing required file: $UUID/$file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Validate metadata.json
        run: |
          python3 -c "import json; json.load(open('$UUID/metadata.json'))"
          echo "metadata.json is valid JSON"

      - name: Validate GSettings schema
        run: |
          glib-compile-schemas --strict "$UUID/schemas/"
          echo "GSettings schema is valid"

  validate-ego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for forbidden patterns
        run: |
          # Synchronous spawn is forbidden in GNOME Shell extensions.
          if grep -r "spawn_command_line_sync" --include="*.js" "$UUID"; then
            echo "ERROR: Found spawn_command_line_sync (use async instead)"
            exit 1
          fi

          # GTK/Adw/Gdk must not be imported into the shell process.
          if grep -nE "from 'gi://(Gtk|Gdk|Adw)'" "$UUID/extension.js" "$UUID"/shell/*.js; then
            echo "ERROR: GTK/Adw imports not allowed in shell-process code"
            exit 1
          fi

          # prefs.js runs in the GTK process and must not import Shell *UI*
          # modules (resource:///org/gnome/shell/ui/...). The ExtensionPreferences
          # base class at resource:///org/gnome/Shell/Extensions/js/extensions/prefs.js
          # is the sanctioned GNOME 45+ prefs import and MUST be allowed.
          if grep -E "resource:///org/gnome/shell/ui|gi://(St|Clutter|Meta|Shell)'" "$UUID/prefs.js" "$UUID"/prefs/*.js; then
            echo "ERROR: Shell UI resource import not allowed in prefs code"
            exit 1
          fi

          # lib/ is loaded by both processes: no UI toolkits, no Shell UI.
          if grep -nE "from 'gi://(St|Clutter|Meta|Shell|Gtk|Gdk|Adw)'|resource:///org/gnome/shell/ui" "$UUID"/lib/*.js; then
            echo "ERROR: shared shell/prefs modules must not import UI toolkits"
            exit 1
          fi

          # Synchronous file IO is flagged in shell-process code (EGO-X-004).
          # prefs.js runs in its own process and is exempt.
          if grep -nE "\.load_contents\(|file_get_contents\(" "$UUID/extension.js" "$UUID"/shell/*.js "$UUID"/lib/*.js; then
            echo "ERROR: synchronous file IO in shell code (use load_contents_async)"
            exit 1
          fi

          echo "EGO validation passed"

  shexli:
    # Static analysis with the EGO reviewers' shexli linter, run against the
    # BUILT zip (make pack) so repo-only artifacts (node_modules, .git) don't
    # produce false findings. shexli 0.2.1 segfaults with
    # tree-sitter(-javascript) >= 0.25 (upstream native bug), so we pin < 0.25.
    # The job fails only on error-severity findings; manual_review / warnings
    # are reported but not blocking. Comments are kept in the packaged zip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y glib-2.0 zip

      - name: Build distribution zip
        run: make pack

      - name: Install shexli
        run: |
          python -m pip install -U pip
          # shexli 0.2.1 declares tree-sitter>=0.25, but that version segfaults
          # on multi-file runs (upstream native bug). Install shexli normally,
          # then force tree-sitter(-javascript) < 0.25 with --no-deps so pip's
          # resolver doesn't reject the known-good downgrade (ResolutionImpossible).
          pip install shexli
          pip install --no-deps --force-reinstall "tree-sitter<0.25" "tree-sitter-javascript<0.25"

      - name: Run shexli on the packaged extension
        run: |
          ZIP="$UUID.shell-extension.zip"
          # Shell 45+ packages must not ship a compiled schema (EGO-P-006).
          if unzip -l "$ZIP" | grep -q "gschemas.compiled"; then
            echo "ERROR: $ZIP ships schemas/gschemas.compiled"
            exit 1
          fi
          echo "== shexli report =="
          shexli "$ZIP" || true
          # Fail only on error-severity findings. EGO-M-004 is excluded: shexli
          # 0.2.1 (the latest) predates GNOME 51, released 2026-09-16, and
          # flags it as a future version. The shell-version list is checked
          # by hand against release.gnome.org instead.
          ERRORS=$(shexli --format json "$ZIP" \
            | python3 -c "import sys,json; print(sum(1 for f in json.load(sys.stdin)['findings'] if f['severity'] == 'error' and f['rule_id'] != 'EGO-M-004'))")
          echo "shexli error-severity findings: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            echo "ERROR: shexli reported $ERRORS error-severity finding(s)"
            exit 1
          fi
          echo "shexli OK (no error-severity findings)"
