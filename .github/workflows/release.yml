name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  UUID: kiro-crew@totoshko88.github.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # Full history + tags: the EGO version bump below reads metadata.json
        # at every previous v* tag; a shallow clone has no tags, so prev was 0.
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y glib-2.0 zip

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update version-name in metadata.json
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        # The user-facing version lives in metadata.json "version-name"
        # (there is no indicator.js in this extension). Sync it to the tag.
        python3 - "$VERSION" << 'EOF'
        import json, sys, os
        version = sys.argv[1]
        path = os.path.join(os.environ['UUID'], 'metadata.json')
        with open(path) as f:
            data = json.load(f)
        data['version-name'] = version
        with open(path, 'w') as f:
            json.dump(data, f, indent=4, ensure_ascii=False)
            f.write('\n')
        print(f"metadata.json version-name set to {version}")
        EOF
        echo "=== metadata.json version-name ==="
        grep -n "version-name" "$UUID/metadata.json" || true

    - name: Extract changelog for version
      id: changelog
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        # Extract section between current version and next version header.
        if [ -f CHANGELOG.md ]; then
          CHANGELOG=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
        else
          CHANGELOG=""
        fi
        echo "$CHANGELOG" > /tmp/release_notes.md
        # Append install instructions + requirements.
        cat >> /tmp/release_notes.md << EOF

        ## Installation

        Download the \`${UUID}.shell-extension.zip\` file and install:

        \`\`\`bash
        gnome-extensions install ${UUID}.shell-extension.zip --force
        gnome-extensions enable ${UUID}
        \`\`\`

        Then restart GNOME Shell (Wayland: log out/in, X11: Alt+F2 → r → Enter).

        ## Requirements

        - GNOME Shell 45, 46, 47, 48, 49, or 50
        - A running Kiro Crew gateway (default http://localhost:5476). The extension fetches its access token automatically on the same machine; you can also set one in Settings.
        EOF

    - name: Bump EGO version in metadata.json (conditional)
      run: |
        # EGO requires a unique, monotonically increasing integer "version" for
        # each upload. Bump it ONLY when the committed value is not already ahead
        # of the previous release tag's packaged version, so a release where the
        # version was already hand-bumped in the commit (tag == committed value)
        # is published as-is, while an un-bumped commit still gets a fresh EGO
        # version automatically. Monotonic either way.
        python3 - << 'EOF'
        import json, subprocess, os
        path = os.path.join(os.environ['UUID'], 'metadata.json')
        with open(path) as f:
            data = json.load(f)
        current = int(data.get('version', 0))

        # Highest EGO version packaged by any previous tag (metadata.json at that tag).
        prev = 0
        try:
            tags = subprocess.run(
                ['git', 'tag', '--list', 'v*'],
                capture_output=True, text=True, check=True
            ).stdout.split()
            for t in tags:
                try:
                    blob = subprocess.run(
                        ['git', 'show', f'{t}:{path}'],
                        capture_output=True, text=True, check=True
                    ).stdout
                    prev = max(prev, int(json.loads(blob).get('version', 0)))
                except Exception:
                    continue
        except Exception:
            prev = 0

        if current > prev:
            print(f"metadata.json EGO version kept at {current} (already > previous {prev})")
        else:
            data['version'] = prev + 1
            with open(path, 'w') as f:
                json.dump(data, f, indent=4, ensure_ascii=False)
                f.write('\n')
            print(f"metadata.json EGO version bumped {current} -> {data['version']} (previous {prev})")
        EOF

    - name: Create distribution package
      run: make pack

    - name: List package
      run: ls -la *.shell-extension.zip

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: Kiro Crew v${{ steps.get_version.outputs.VERSION }}
        body_path: /tmp/release_notes.md
        files: |
          ${{ env.UUID }}.shell-extension.zip
        draft: false
        prerelease: false
